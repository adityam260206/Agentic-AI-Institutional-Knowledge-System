# ── EduMind AI — Docker Compose ────────────────────────────────────────────────
#
# Services:
#   ollama       — Ollama LLM server (port 11434); GPU-accelerated if enabled below
#   ollama-init  — one-shot job that pulls qwen3:8b before the app starts
#   edumind      — FastAPI application and web UI (port 8000)
#
# Persistent volumes (code stays in the image; only state lives on volumes):
#   edumind_state      — SQLite: ingestion_ledger.db + institutional.db
#   edumind_chroma     — ChromaDB vector store
#   edumind_staging    — documents to ingest (data/staging)
#   edumind_hf_cache   — Hugging Face models (BGE embedder + reranker)
#   edumind_ollama     — Ollama model cache
#
# Usage (from the repository root):
#   JWT_SECRET_KEY=<long random string> docker compose -f docker/docker-compose.yml up --build
#   (or put JWT_SECRET_KEY in a .env file next to this compose file)

services:

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU acceleration: uncomment if an NVIDIA GPU and the container toolkit are available
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      # The ollama image has no curl; the CLI talks to the local server instead.
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["ollama", "pull", "qwen3:8b"]
    restart: "no"

  edumind:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY (a long random string) before starting}"
      LEDGER_DB_PATH: "/app/state/ingestion_ledger.db"
      DATABASE_URL: "sqlite:////app/state/institutional.db"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
      PYTHONPATH: "/app"
    volumes:
      - state_data:/app/state
      - chroma_data:/app/vector_store/chroma_db
      - staging_data:/app/data/staging
      - hf_cache:/root/.cache/huggingface

volumes:
  ollama_data:
    name: edumind_ollama
  state_data:
    name: edumind_state
  chroma_data:
    name: edumind_chroma
  staging_data:
    name: edumind_staging
  hf_cache:
    name: edumind_hf_cache
